<form id="rsvp-form" novalidate>
  <div class="field-row">
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Full name">
      <p class="error" id="err-name" aria-live="polite"></p>
    </div>

    <div class="field">
      <label for="persons">How many persons?</label>
      <input id="persons" name="persons" type="number" min="1" max="50" step="1" value="1">
      <p class="help">Everyone coming, kids included.</p>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="kids">How many kids?</label>
      <input id="kids" name="kids" type="number" min="0" max="50" step="1" value="0">
      <p class="help">Part of the total.</p>
    </div>

    <div class="field">
      <legend>Will you attend the church morning service?</legend>
      <div class="choice-group">
        <div class="choice">
          <input type="radio" id="svc-yes" name="service" value="Yes">
          <label for="svc-yes">Yes</label>
        </div>
        <div class="choice">
          <input type="radio" id="svc-no" name="service" value="No">
          <label for="svc-no">No</label>
        </div>
      </div>
      <p class="error" id="err-service" aria-live="polite"></p>
    </div>
  </div>

  <div class="field">
    <legend>Will you attend the Cantata only?</legend>
    <div class="choice-group">
      <div class="choice">
        <input type="radio" id="can-yes" name="cantata" value="Yes">
        <label for="can-yes">Yes</label>
      </div>
      <div class="choice">
        <input type="radio" id="can-no" name="cantata" value="No">
        <label for="can-no">No</label>
      </div>
    </div>
    <p class="error" id="err-cantata" aria-live="polite"></p>
  </div>

  <p class="error" id="err-count" aria-live="polite"></p>
  <button type="submit" class="submit-btn">Submit RSVP</button>
  <div id="submit-status" class="save-status" aria-live="polite"></div>
</form>

<script>
  const FORM_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

  function setError(id, msg) {
    const el = document.getElementById(id);
    if (el) el.textContent = msg || "";
  }

  function radioValue(name) {
    const checked = document.querySelector('input[name="' + name + '"]:checked');
    return checked ? checked.value : "";
  }

  function whole(v) {
    const n = Number(v);
    return v !== "" && isFinite(n) && Math.floor(n) === n ? n : NaN;
  }

  document.getElementById("rsvp-form").addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const persons = whole(document.getElementById("persons").value.trim());
    const kids = whole(document.getElementById("kids").value.trim());
    const service = radioValue("service");
    const cantata = radioValue("cantata");

    let valid = true;

    if (!name) {
      setError("err-name", "Please enter your name.");
      valid = false;
    } else setError("err-name", "");

    if (isNaN(persons) || persons < 1) {
      setError("err-count", "Enter at least 1 person.");
      valid = false;
    } else if (isNaN(kids) || kids < 0) {
      setError("err-count", "Enter 0 or more kids.");
      valid = false;
    } else if (kids > persons) {
      setError("err-count", "Kids cannot be more than the total number of persons.");
      valid = false;
    } else {
      setError("err-count", "");
    }

    if (!service) {
      setError("err-service", "Please choose Yes or No.");
      valid = false;
    } else setError("err-service", "");

    if (!cantata) {
      setError("err-cantata", "Please choose Yes or No.");
      valid = false;
    } else setError("err-cantata", "");

    if (!valid) return;

    const formData = new URLSearchParams({
      name,
      persons: String(persons),
      kids: String(kids),
      service,
      cantata
    });

    fetch(FORM_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: formData.toString()
    })
    .then(response => response.text())
    .then(() => {
      document.getElementById("submit-status").textContent = "Your RSVP was submitted successfully.";
      document.getElementById("rsvp-form").reset();
      document.getElementById("persons").value = "1";
      document.getElementById("kids").value = "0";
    })
    .catch(() => {
      document.getElementById("submit-status").textContent = "Submission failed. Please try again.";
    });
  });
</script>
